name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # onnxruntime-node (under kokoro-js, the voice) downloads CUDA binaries on any
    # Linux x64 install; we never use them, and v1.21.0's download is gone (404).
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: node scripts/version.ts --check
      - run: pnpm check-types
      - run: pnpm build
      - run: pnpm test
