name: Release

# Pushing a tag v<version> publishes pr2video@<version> to npm and makes a GitHub release.
# npm trusts this workflow by OIDC (trusted publishing), so no npm token is stored anywhere;
# the package gets a provenance statement linking it to this commit. Setup: RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the GitHub release
  id-token: write # npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    # onnxruntime-node (under kokoro-js, the voice) downloads CUDA binaries on any
    # Linux x64 install; we never use them, and v1.21.0's download is gone (404).
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest

      - name: The tag matches the CLI, plugin and skill versions
        run: node scripts/version.ts --check "${GITHUB_REF_NAME#v}"

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm build
      - run: pnpm test

      # pnpm pack rewrites catalog: and workspace:* in the manifest; npm publishes the tarball,
      # because npm is what speaks trusted publishing.
      - name: Publish to npm
        run: |
          mkdir -p /tmp/pack
          (cd packages/cli && pnpm pack --pack-destination /tmp/pack)
          tag=latest
          case "$GITHUB_REF_NAME" in *-*) tag=next ;; esac
          npm publish /tmp/pack/pr2video-*.tgz --access public --tag "$tag"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" /tmp/pack/pr2video-*.tgz --generate-notes $flags
